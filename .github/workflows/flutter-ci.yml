name: Flutter CI

# با هر push یا Pull Request روی main، این مراحل خودکار اجرا می‌شن.
# نتیجه رو توی تب "Actions" همین ریپو گیت‌هاب می‌بینید.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # اجازه می‌ده دستی هم از تب Actions بزنید Run

jobs:
  analyze_and_test:
    name: آنالیز و تست
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: نصب وابستگی‌ها
        run: flutter pub get

      - name: بررسی فرمت کد
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true # فقط هشدار می‌ده، جلوی بقیه مراحل رو نمی‌گیره

      - name: آنالیز استاتیک (پیدا کردن خطا/باگ‌های احتمالی)
        run: flutter analyze

      - name: اجرای تست‌های واحد و ویجت
        run: flutter test

  build_android:
    name: ساخت نسخه‌ی آزمایشی اندروید (APK)
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: ساخت APK دیباگ
        run: flutter build apk --debug
      - name: آپلود فایل APK به‌عنوان خروجی
        uses: actions/upload-artifact@v4
        with:
          name: clinic-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build_windows:
    name: ساخت نسخه‌ی ویندوز
    needs: analyze_and_test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: ساخت exe ویندوز
        run: flutter build windows
      - name: آپلود خروجی ویندوز
        uses: actions/upload-artifact@v4
        with:
          name: clinic-app-windows
          path: build/windows/x64/runner/Release
